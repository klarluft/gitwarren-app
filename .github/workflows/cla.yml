name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    # Only react to the signature phrase, or to pull request events. Without
    # this, every comment on every issue would spin up a runner.
    if: |
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/michal-wrzosek/gitwarren-app/blob/main/CLA.md'
          # Signatures live on their own branch so they never appear in a
          # source diff or trigger CI.
          branch: 'cla-signatures'
          allowlist: 'michal-wrzosek,dependabot[bot]'
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/michal-wrzosek/gitwarren-app/blob/main/CLA.md)
            and sign it by posting a comment on this pull request with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
