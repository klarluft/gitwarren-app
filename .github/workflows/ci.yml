name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when the branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 to match the npm that writes package-lock.json locally. Node 22
      # ships npm 10, which keeps a top-level entry for every dependency of an
      # optional platform package; npm 11 prunes them, so a lockfile written by
      # npm 11 is rejected by `npm ci` on npm 10 as out of sync. Keep this in
      # step with release.yml and deploy-site.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs the postinstall (electron-builder install-app-deps),
      # which rebuilds better-sqlite3 against Electron's headers. The tests
      # open a real SQLite file, so this has to happen before them.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # The suite shells out to a real git and writes to a temp
      # GITWARREN_DATA_DIR, so git has to be present — it is, on all
      # GitHub-hosted runners.
      - run: npm test
