name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when the branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .nvmrc is the single source of truth, shared with local development
      # through `fnm env --use-on-cd`. Pinning the version in one file rather
      # than three keeps CI from drifting away from the machines that write
      # package-lock.json. `engines` in package.json states the floor and
      # .npmrc makes it an error rather than a warning.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs the postinstall (electron-builder install-app-deps),
      # which rebuilds better-sqlite3 against Electron's headers. The tests
      # open a real SQLite file, so this has to happen before them.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # The suite shells out to a real git and writes to a temp
      # GITWARREN_DATA_DIR, so git has to be present — it is, on all
      # GitHub-hosted runners.
      - run: npm test
