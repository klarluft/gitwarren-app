name: Deploy site

# gitwarren.com bakes its download URLs in at build time, reading them from
# this repository's releases API. electron-builder puts the version in every
# asset name (GitWarren-0.1.0-arm64.dmg), so there is no static
# `releases/latest/download/<name>` URL the site could link instead — it has to
# rebuild for the buttons to point at a new release.
#
# Deliberately triggered by `release: published`, not by the tag push that
# drives release.yml. That workflow creates a *draft* and uploads installers
# into it, and a draft's assets are not visible to the releases API. Rebuilding
# the site at the end of release.yml would therefore publish a site whose
# buttons still point at the previous release, or fall back to the releases
# page. Publishing the draft is the moment the assets become real.
#
# `published` rather than `released`, even though `released` already skips
# prereleases: keeping the broader trigger means the decision to skip one is
# written here, in an `if:` that can be read, rather than inferred from which
# webhook GitHub chose to send.
#
# And skipped it must be. A prerelease is published so that testers can be
# handed a link to it; gitwarren.com is where everyone else arrives, and its
# buttons should go on pointing at the newest stable build. The site's own
# lookup declines prereleases as well - this is the outer of the two guards,
# and the one that saves an entire pointless deploy.

on:
  release:
    types: [published]
  # Allows a redeploy without touching a release — useful after a site change
  # that has not been deployed by other means.
  workflow_dispatch:

jobs:
  deploy:
    name: Rebuild and deploy gitwarren.com
    # `github.event.release` is absent on a manual run, which leaves the first
    # clause true and the redeploy button working.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      # Both repositories are public, so the default token is enough here.
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          repository: klarluft/gitwarren-site
          ref: main

      # The checkout above is the *site*, so this reads gitwarren-site's own
      # .nvmrc — that repository declares the Node its lockfile is written
      # with, and this job simply obeys it. Nothing to keep in sync by hand.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run deploy` is `astro build && wrangler deploy` — the build is
      # what reads this repository's releases API, so nothing about the
      # release needs to be passed through.
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The site build reads this repository's releases API. Unauthenticated,
          # that is 60 requests an hour shared across every runner on the host
          # IP, and it is routinely exhausted — which is how gitwarren.com came
          # to advertise v0.1.0 while v0.1.3 was current. The default token
          # raises it to 5000 an hour, counted per token. The site now fails its
          # build rather than deploy fallback links, so without this a deploy
          # can stop outright.
          GITHUB_TOKEN: ${{ github.token }}
